<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tree of Birds</title>
<script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
/* -------------------- Fonts & Colors -------------------- */
@font-face {
  font-family: "Game of Thrones";
  src: url("Game of Thrones.ttf");
}

:root {
  --lightPink: #FFE9F0;
  --darkPink: #FD81B0;
  --lightBlue: #E1F5FF;
  --darkBlue: #2EAAE4;
  --systemNavy: #2a4d69;
  --systemGray: #a0a0a0;
  --systemLightGray: #f7f7f7;
}

html {
  height: 100%;
  margin: 0;
  font-family: sans-serif;
}

body {
  height: 100%;
  margin: 0;
  font-family: sans-serif;
  display: flex;
  flex-direction: column;
}

/* -------------------- Header -------------------- */
header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--systemNavy);
  color: white;
  padding: 0 20px;
  letter-spacing: 0.3rem;
}

h2 {
  font-size: 30px;
  font-family: "Game of Thrones";
  color: white;
}

h2 span {
  font-size: 0.7em;
  position: relative;
  bottom: 0.15em;
}

/* -------------------- Content / Graph -------------------- */
#content {
  display: flex;
  flex: 1;
  min-height: 400px;
  position: relative;
}

#graph-container {
  flex: 1 1 auto;
  overflow: hidden;
}

#graph {
  width: 100%;
  height: 100%;
  border: 1px solid var(--systemGray);
  background: white;
}

#intro-message {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  text-align: center;
  font-size: 1.2em;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.5em;
}

/* -------------------- Sidebar -------------------- */
#sidebar-wrapper {
  display: flex;
  height: 100%;
}

#sidebar {
  position: relative;
  flex: 0 0 300px;
  min-width: 200px;
  max-width: 600px;
  display: flex;
  flex-direction: column;
  background: var(--systemLightGray);
  border-left: 2px solid var(--systemGray);
  overflow-x: hidden;
  overflow-y: auto;
  box-sizing: border-box;
  transition: width 0.05s linear;
}

#sidebar:hover {
  overflow-y: auto;
}

#sidebar h3 {
  width: 100%;
  background-color: var(--systemGray);
  padding: 10px;
  margin: 0;
  margin-bottom: 20px;
  position: sticky;
  top: 0;
  z-index: 2;
  border-bottom: 1px solid black;
  -webkit-box-shadow: 0px 5px 15px rgba(0,0,0,0.5);
  box-shadow: 0px 5px 15px rgba(0,0,0,0.5);
}

#info {
  flex: 1;
  padding: 10px;
  overflow-y: auto;
}

#sidebar-resizer {
  position: absolute;
  top: 0;
  right: 0;          /* stick to right edge */
  width: 12px;       /* easier to grab */
  height: 100%;
  cursor: ew-resize;  /* horizontal resize cursor */
  background: transparent; /* invisible but still detects events */
  z-index: 20;
}

/* -------------------- List Pane -------------------- */
#list-pane {
  position: relative;
  flex-shrink: 0;
  height: 300px;
  min-height: 100px;
  max-height: 600px;
  overflow: hidden;
  border-top: 1px solid black;
  transition: height 0.05s linear;
}

#list-pane h3 {
  width: 100%;
  background-color: var(--systemGray);
  padding: 10px;
  margin: 0;
  position: sticky;
  top: 0;
  z-index: 2;
  border-bottom: 1px solid black;
  -webkit-box-shadow: 0px 5px 15px rgba(0,0,0,0.5);
  box-shadow: 0px 5px 15px rgba(0,0,0,0.5);
}

#list-resizer {
  position: absolute;
  top: -4px;
  left: 0;
  width: 100%;
  height: 8px;
  cursor: ns-resize;
  background: transparent;
  z-index: 20;
}

/* -------------------- Bird List -------------------- */
.bird-row {
  border-radius: 6px;
  padding: 4px 8px;
  margin: 2px 0;
  display: flex;
  align-items: center;
  cursor: pointer;
}

.bird-row.male {
  border: 1px solid var(--darkBlue);
  background: var(--lightBlue);
}

.bird-row.female {
  border: 1px solid var(--darkPink);
  background: var(--lightPink);
}

.bird-row.selected span.plus-x {
  transform: rotate(45deg);
  font-weight: bold;
}

/* -------------------- Info Cards -------------------- */
.info-card {
  border: 1px solid;
  border-left: 6px solid;
  border-radius: 6px;
  padding: 6px;
  margin-bottom: 10px;
  color: black;
}

.info-card.male {
  border-color: var(--darkBlue);
  background-color: var(--lightBlue);
}

.info-card.female {
  border-color: var(--darkPink);
  background-color: var(--lightPink);
}

.info-card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.info-card-header .close-btn {
  cursor: pointer;
  font-weight: bold;
  font-size: 1.2em;
  color: black;
}

/* -------------------- Modal -------------------- */
.modal {
  display: none;
  position: fixed;
  z-index: 10;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  overflow: auto;
  background-color: rgba(0,0,0,0.5);
}

.modal-content {
  background-color: white;
  margin: 10% auto;
  padding: 20px 30px;
  border-radius: 8px;
  width: 90%;
  max-width: 500px;
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
}

.close-modal {
  float: right;
  font-size: 22px;
  font-weight: bold;
  cursor: pointer;
  color: black;
}

.close-modal:hover {
  color: var(--systemGray);
}
</style>

</head>
<body>

<header>
  <h2>Tree <span>of</span> Birds</h2>
  <input type="file" id="fileInput" accept=".csv,.tsv">
</header>

<div id="content">
  <div id="graph-container">
    <div id="graph"></div>
    <div id="intro-message"></div>
  </div>

  <div id="sidebar-wrapper">
    <div id="sidebar">
      <div id="sidebar-resizer"></div>
      <h3>Bird Info</h3>
      <div id="info"><em>No birds selected</em></div>
    </div>
  </div>
</div>

<div id="list-pane">
  <div id="list-resizer"></div>
  <h3>Bird List</h3>
  <div id="bird-list"><i>No data loaded</i></div>
</div>

<div id="learnMoreModal" class="modal">
  <div class="modal-content">
    <span class="close-modal">&times;</span>
    <h3>Data Format Guide</h3>
    <p>Upload a CSV or TSV file with columns: <code>id, name, sex, motherID, fatherID</code></p>
  </div>
</div>

<script>
const graphContainer = document.getElementById("graph");
const intro = document.getElementById("intro-message");
const infoDiv = document.getElementById("info");
const birdListDiv = document.getElementById("bird-list");

let data = [], selectedBirds = new Set(), fileLoaded = false;

document.getElementById("fileInput").addEventListener("change", e => {
  const file = e.target.files[0]; if (!file) return;
  const ext = file.name.split('.').pop().toLowerCase();
  const delimiter = ext === "tsv" ? "\t" : ",";
  Papa.parse(file, {
    header: true, delimiter,
    complete: results => {
      data = results.data.filter(d => d.id && d.name);
      fileLoaded = true;
      populateList();
      drawGraph(selectedBirds, data);
      updateIntro();
    }
  });
});

function populateList() {
  birdListDiv.innerHTML = '';
  data.forEach(b => {
    const gender = (b.sex || '').trim().toUpperCase();
    const row = document.createElement('div');
    row.className = `bird-row ${gender==='F'?'female':'male'}`;
    if (selectedBirds.has(b.id)) row.classList.add('selected');
    row.innerHTML = `<span class="bird-name">${b.name} (${b.id})</span><span class="plus-x">+</span>`;
    row.onclick = () => {
      if(selectedBirds.has(b.id)) selectedBirds.delete(b.id);
      else selectedBirds.add(b.id);
      populateList(); updateSidebar(); drawGraph(selectedBirds, data); updateIntro();
    };
    birdListDiv.appendChild(row);
  });
}

function updateSidebar() {
  infoDiv.innerHTML = '';
  if (!selectedBirds.size) { infoDiv.innerHTML = '<em>No birds selected</em>'; return; }
  selectedBirds.forEach(id => {
    const bird = data.find(b=>b.id===id); if(!bird) return;
    const gender=(bird.sex||'').trim().toUpperCase();
    const mother = data.find(b=>b.id===bird.motherID);
    const father = data.find(b=>b.id===bird.fatherID);
    const offspring = data.filter(b=>b.motherID===bird.id||b.fatherID===bird.id);
    const card=document.createElement('div');
    card.className=`info-card ${gender==='F'?'female':'male'}`;
    card.innerHTML=`
      <div class="info-card-header">
        <strong>${gender==='F'?'♀':'♂'} ${bird.name}</strong>
        <span class="close-btn">&times;</span>
      </div>
      <table>
        <tr><td>ID</td><td>${bird.id}</td></tr>
        <tr><td>Mother</td><td>${mother?`<span class="female parent" data-id="${mother.id}">♀ ${mother.name}</span>`:'Unknown'}</td></tr>
        <tr><td>Father</td><td>${father?`<span class="male parent" data-id="${father.id}">♂ ${father.name}</span>`:'Unknown'}</td></tr>
        <tr><td>Offspring</td><td>${offspring.length?offspring.map(o=>`<span class="${o.sex==='F'?'female':'male'} offspring" data-id="${o.id}">${o.sex==='F'?'♀':'♂'} ${o.name}</span>`).join('<br>'):'None'}</td></tr>
      </table>`;
    card.querySelector('.close-btn').onclick = () => { selectedBirds.delete(id); updateSidebar(); drawGraph(selectedBirds,data); populateList(); };
    infoDiv.appendChild(card);
  });
  infoDiv.querySelectorAll('.parent, .offspring').forEach(el=>{
    el.addEventListener('click', e=>{
      const id=e.target.dataset.id; if(id){ selectedBirds.add(id); updateSidebar(); populateList(); drawGraph(selectedBirds,data); }
    });
  });
}

function updateIntro() {
  intro.innerHTML=''; intro.style.display='block';
  if(!fileLoaded) intro.innerHTML=`<p>To begin, select a data source above. ⬆</p><a href="#" id="learnMoreLink">Learn more</a>`;
  else if(selectedBirds.size===0) intro.innerHTML='<p>Select at least one bird below to explore. ⬇</p>';
  else intro.style.display='none';
}

function drawGraph(selectedSet, allBirds) {
  const container = document.getElementById("graph"); container.innerHTML='';
  if(!allBirds.length||!selectedSet.size) return;
  const byId = Object.fromEntries(allBirds.map(b=>[b.id,b]));
  const related=new Set();
  function addRelatives(id){ if(!id||related.has(id)) return; related.add(id); const b=byId[id]; if(!b) return; if(b.motherID) addRelatives(b.motherID); if(b.fatherID) addRelatives(b.fatherID); allBirds.forEach(c=>{ if(c.motherID===id||c.fatherID===id) addRelatives(c.id); }); }
  selectedSet.forEach(addRelatives);
  const birdsToShow = Array.from(related).map(id=>byId[id]).filter(Boolean);
  const nodes = birdsToShow.map(b=>{
    const gender=(b.sex||"").trim().toUpperCase();
    const isSelected=selectedSet.has(b.id);
    return {id:b.id,label:`${b.name}\n(${b.id})`,group:gender==='F'?'female':'male',borderWidth:isSelected?3:1,
      color:{background:"#fff",border:gender==='F'? "var(--lightPink)":"var(--lightBlue)",
      highlight:{background:gender==='F'? "var(--lightPink)":"var(--lightBlue)",border:gender==='F'? "var(--darkPink)":"var(--darkBlue)"},
      hover:{background:gender==='F'? "var(--lightPink)":"var(--lightBlue)",border:gender==='F'? "var(--darkPink)":"var(--darkBlue)"}},
      font:{color:"#000",size:16}};
  });
  const edges=[];
  birdsToShow.forEach(b=>{
    if(b.motherID&&byId[b.motherID]) edges.push({from:b.motherID,to:b.id,color:"var(--systemLightGray)",arrows:"to"});
    if(b.fatherID&&byId[b.fatherID]) edges.push({from:b.fatherID,to:b.id,color:"var(--systemLightGray)",arrows:"to"});
  });
  const networkData={nodes:new vis.DataSet(nodes),edges:new vis.DataSet(edges)};
  const options={
    layout:{hierarchical:{direction:"UD",sortMethod:"directed",nodeSpacing:120,levelSeparation:150}},
    edges:{color:"var(--systemLightGray)",smooth:{enabled:true,type:"cubicBezier",forceDirection:"vertical",roundness:0.4},arrows:{to:{enabled:true,type:"arrow"}}},
    nodes:{shape:"box",font:{color:"#000",size:16},margin:8},
    physics:{enabled:true,solver:"hierarchicalRepulsion",hierarchicalRepulsion:{nodeDistance:150,avoidOverlap:0.5}},
    interaction:{hover:true}
  };
  const network=new vis.Network(container,networkData,options);
  network.once('stabilizationIterationsDone',()=>network.setOptions({physics:false}));
}

// -------------------- Modal --------------------
const modal=document.getElementById('learnMoreModal');
document.addEventListener('click', e=>{
  if(e.target.id==='learnMoreLink'){ e.preventDefault(); modal.style.display='block'; }
  if(e.target===modal) modal.style.display='none';
});
document.querySelector('.close-modal').onclick=()=>{modal.style.display='none';};
updateIntro();

// -------------------- Sidebar & List Resizing --------------------
document.addEventListener('DOMContentLoaded', () => {
const sidebar = document.getElementById('sidebar');
const sidebarResizer = document.getElementById('sidebar-resizer');
const content = document.getElementById('content');
let isResizingSidebar = false;

sidebarResizer.addEventListener('mousedown', e => {
  isResizingSidebar = true;
  document.body.style.cursor = 'ew-resize';
  e.preventDefault();
});

window.addEventListener('mousemove', e => {
  if (!isResizingSidebar) return;
  const containerRect = content.getBoundingClientRect();
  let newWidth = e.clientX - containerRect.left;
  newWidth = Math.min(Math.max(newWidth, 200), 600);
  sidebar.style.width = newWidth + 'px';
});

window.addEventListener('mouseup', () => {
  isResizingSidebar = false;
  document.body.style.cursor = '';
});

  // --- List Pane (vertical) ---
  let isResizingList = false;
  let startY = 0;
  let startHeight = 0;

  listResizer.addEventListener('mousedown', e => {
    isResizingList = true;
    startY = e.clientY;
    startHeight = listPane.offsetHeight;
    document.body.style.cursor = 'ns-resize';
    e.preventDefault();
  });

  window.addEventListener('mousemove', e => {
    if (!isResizingList) return;
    const dy = startY - e.clientY; // drag upwards increases height
    let newHeight = startHeight + dy;
    newHeight = Math.min(Math.max(newHeight, 100), 600); // min/max
    listPane.style.height = `${newHeight}px`;
  });

  window.addEventListener('mouseup', () => {
    if (isResizingList) {
      isResizingList = false;
      document.body.style.cursor = '';
    }
  });
});

</script>

</body>
</html>
